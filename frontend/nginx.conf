server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend service so the SPA can use relative /api/v1 paths
  # This ensures requests like /api/v1/notices are forwarded to the backend container
  # (backend defined in docker-compose as service name `backend` on port 4000)
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow websockets and other connection upgrades if needed
    proxy_set_header Upgrade $http_upgrade;
    # Use the client's Connection header (or keep default)
    proxy_set_header Connection "upgrade";
    # Increase timeout for long requests (file uploads, etc.)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }
}

