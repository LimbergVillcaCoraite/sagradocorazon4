name: ci-cd

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SECRET_KEY: ci-test-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==7.4.0 pytest-asyncio==0.21.1 aiosqlite

      - name: Run tests
        run: |
          pytest tests/test_auth.py tests/test_content.py tests/test_uploads.py tests/test_notifications.py tests/test_google_calendar.py tests/test_history.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --silent

      - name: Build frontend
        env:
          VITE_API_URL: /api/v1
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api/v1
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.PROD_HOST != ''
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR=/opt/sagradoCorazon4
            COMPOSE_CMD=podman-compose

            # Update source code
            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            # Write secrets to .env.prod
            cat > "$APP_DIR/.env.prod" <<ENVEOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_NAME=${{ secrets.ADMIN_NAME:-Administrador }}
            ENVEOF

            # Pull latest images from GHCR (built by docker-build job)
            docker pull ghcr.io/limbergvillcacoraite/sagradocorazon4/backend:latest
            docker pull ghcr.io/limbergvillcacoraite/sagradocorazon4/frontend:latest

            # Tag as prod so docker-compose.prod.yml image references resolve
            docker tag ghcr.io/limbergvillcacoraite/sagradocorazon4/backend:latest localhost/sagradocorazon4-backend:prod
            docker tag ghcr.io/limbergvillcacoraite/sagradocorazon4/frontend:latest localhost/sagradocorazon4-frontend:prod

            # Restart with new images, no rebuild needed
            $COMPOSE_CMD -f docker-compose.prod.yml --env-file .env.prod down
            $COMPOSE_CMD -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

            # Apply any pending DB migrations
            sleep 10
            $COMPOSE_CMD -f docker-compose.prod.yml exec -T backend alembic upgrade heads

            docker image prune -f

