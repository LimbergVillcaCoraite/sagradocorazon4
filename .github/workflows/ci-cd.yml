name: ci-cd

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==7.4.0 pytest-asyncio==0.21.1

      - name: Run tests
        run: |
          pytest tests/test_auth.py tests/test_content.py tests/test_uploads.py tests/test_notifications.py tests/test_google_calendar.py tests/test_history.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci --silent

      - name: Build frontend
        env:
          VITE_API_URL: /api/v1
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api/v1
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            APP_DIR=/opt/sagradoCorazon4

            if ! command -v git >/dev/null 2>&1; then
              sudo yum install -y git
            fi

            if ! command -v docker >/dev/null 2>&1; then
              sudo yum install -y docker || sudo yum install -y podman podman-docker
            fi

            if systemctl list-unit-files | grep -q '^docker\.service'; then
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo yum install -y docker-compose-plugin || true
              if ! docker compose version >/dev/null 2>&1; then
                sudo yum install -y python3-pip || true
                python3 -m pip install --user podman-compose || true
                if [ -f /home/$USER/.local/bin/podman-compose ]; then
                  sudo ln -sf /home/$USER/.local/bin/podman-compose /usr/local/bin/docker-compose
                fi
              fi
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            elif command -v podman-compose >/dev/null 2>&1; then
              COMPOSE_CMD="podman-compose"
            else
              echo "No compose command found"
              exit 1
            fi

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            cat > .env.prod << 'EOF'
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            ADMIN_NAME=${{ secrets.ADMIN_NAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF

            $COMPOSE_CMD -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f

