# PostgreSQL Client Authentication Configuration
# ===============================================

# Unix socket (local tools inside container)
local   all             all                                     trust

# Loopback - trust (postgres tools running inside the container)
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Docker internal network - trust (backend/app containers only)
# The 10.89.0.0/16 range covers Podman's default CNI network
host    all             all             10.89.0.0/16            trust
host    all             all             10.0.0.0/8              trust

# Replication (local only)
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# External connections (DBeaver, etc.) - require password
host    all             all             all                     scram-sha-256
